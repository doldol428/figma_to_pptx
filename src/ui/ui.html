<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    font: 11px/1.5 Inter, "Pretendard", "Malgun Gothic", -apple-system, sans-serif;
    background: var(--figma-color-bg, #fff);
    color: var(--figma-color-text, #000);
  }
  h1 { font-size: 11px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
  .card {
    border: 1px solid var(--figma-color-border, #e5e5e5);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .size {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .size small { font-size: 11px; font-weight: 400; opacity: .7; }
  .sub { color: var(--figma-color-text-secondary, #666); margin-top: 2px; }
  .sub.danger { color: var(--figma-color-text-danger, #b3261e); }
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--figma-color-bg-brand-tertiary, #e5f0ff);
    color: var(--figma-color-text-brand, #0d63f3);
    font-size: 11px;
    font-weight: 600;
    vertical-align: 3px;
    margin-left: 6px;
  }
  .blocked {
    background: var(--figma-color-bg-danger-tertiary, #ffe8e5);
    color: var(--figma-color-text-danger, #b3261e);
    border-radius: 6px;
    padding: 10px;
    white-space: pre-wrap;
    margin-bottom: 8px;
  }

  /* 드롭다운과 버튼을 같은 규격으로 맞춘다 — 나란히 놓이는 컨트롤이라 형태가 어긋나면 눈에 띈다. */
  .control {
    height: 32px;
    padding: 0 10px;
    border-radius: 6px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  /* 두 탭의 주 버튼은 같은 규격이어야 한다 — 탭을 오가며 크기가 달라지면 어색하다. */
  #export, #pick { display: block; width: 100%; }
  .primary {
    border: 1px solid transparent;
    background: var(--figma-color-bg-brand, #0d99ff);
    color: #fff;
  }
  .primary:disabled {
    background: var(--figma-color-bg-disabled, #e5e5e5);
    color: var(--figma-color-text-disabled, #b3b3b3);
    cursor: not-allowed;
  }
  .secondary {
    border: 1px solid var(--figma-color-border, #e5e5e5);
    background: transparent;
    color: var(--figma-color-text, #000);
  }
  .secondary:hover:not(:disabled) { border-color: var(--figma-color-border-selected, #0d99ff); }
  .secondary:disabled { color: var(--figma-color-text-disabled, #b3b3b3); cursor: not-allowed; }

  /*
   * 커스텀 드롭다운.
   * 네이티브 select 의 팝업 목록은 OS 가 그려서 CSS 가 닿지 않는다 — 모서리도 각지고
   * 테마도 따로 논다. 그래서 트리거 버튼 + 절대배치 목록으로 직접 만든다.
   */
  /* 라벨은 왼쪽, 컨트롤은 오른쪽. 드롭다운은 값 길이만큼만 차지한다. */
  .field {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .field-label { color: var(--figma-color-text-secondary, #666); }
  /* 라벨은 왼쪽, 값은 오른쪽 끝. 드롭다운(.select)과 같은 자리에 선다. */
  .field-input {
    margin-left: auto;
    width: 110px;
    font-weight: 400;
  }

  .select { position: relative; margin-left: auto; }
  .select-trigger {
    position: relative;
    /* 96/150/220/300 어느 값이든 폭이 안 흔들리게 고정 */
    width: 86px;
    text-align: left;
    padding-right: 24px;
  }
  .select-trigger::after {
    content: '';
    position: absolute;
    right: 11px;
    top: 50%;
    margin-top: -2px;
    border: 4px solid transparent;
    /* currentColor 라서 라이트/다크 어느 쪽에서도 본문 색을 따라간다 */
    border-top-color: currentColor;
    opacity: .5;
  }
  .select-menu {
    position: absolute;
    /* 트리거는 좁지만 목록은 보조 문구까지 담아야 하므로 오른쪽 끝을 맞추고 왼쪽으로 넓힌다 */
    right: 0;
    top: calc(100% + 4px);
    min-width: 100%;
    width: max-content;
    z-index: 10;
    padding: 4px;
    border: 1px solid var(--figma-color-border, #e5e5e5);
    border-radius: 6px;
    background: var(--figma-color-bg, #fff);
    box-shadow: 0 4px 16px rgba(0, 0, 0, .16), 0 1px 3px rgba(0, 0, 0, .08);
  }
  .opt {
    display: flex;
    align-items: center;
    height: 28px;
    padding: 0 8px 0 22px;
    border-radius: 4px;
    position: relative;
    cursor: pointer;
    white-space: nowrap;
  }
  .opt.active { background: var(--figma-color-bg-hover, #f0f0f0); }
  .opt[aria-selected="true"] { font-weight: 600; }
  .opt[aria-selected="true"]::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 50%;
    width: 4px;
    height: 8px;
    margin-top: -6px;
    border: solid var(--figma-color-text-brand, #0d63f3);
    border-width: 0 1.5px 1.5px 0;
    transform: rotate(45deg);
  }
  .opt-note {
    margin-left: auto;
    padding-left: 24px;
    font-weight: 400;
    color: var(--figma-color-text-tertiary, #999);
  }

  /* 방향 전환 탭 */
  .tabs {
    display: flex;
    gap: 2px;
    padding: 2px;
    margin-bottom: 10px;
    border-radius: 7px;
    background: var(--figma-color-bg-secondary, #f0f0f0);
  }
  .tab {
    flex: 1;
    height: 26px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--figma-color-text-secondary, #666);
    font: inherit;
    cursor: pointer;
  }
  .tab[aria-selected="true"] {
    background: var(--figma-color-bg, #fff);
    color: var(--figma-color-text, #000);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .1);
  }

  #warnings { max-height: 200px; overflow-y: auto; margin: 8px 0 0; }
  #warnings ul { margin: 6px 0 0; padding-left: 16px; }
  #warnings li { margin-bottom: 4px; color: var(--figma-color-text-secondary, #666); }
  #warnings li:last-child { margin-bottom: 0; }
  #warnings b { color: var(--figma-color-text, #000); font-weight: 600; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="tabs" role="tablist">
    <button type="button" class="tab" id="tabExport" role="tab" aria-selected="true"></button>
    <button type="button" class="tab" id="tabImport" role="tab" aria-selected="false"></button>
  </div>

  <div id="paneExport">
  <div class="card">
    <h1 id="slideSizeTitle"></h1>
    <div class="size" id="size">—</div>
    <div class="sub" id="detail"></div>
  </div>

  <div class="blocked hidden" id="blocked"></div>

  <div class="field">
    <span class="field-label" id="dpiLabel"></span>
    <div class="select" id="dpiSelect">
      <button type="button" class="control secondary select-trigger" id="dpiTrigger"
              aria-haspopup="listbox" aria-expanded="false" aria-labelledby="dpiLabel"></button>
      <div class="select-menu hidden" id="dpiMenu" role="listbox"></div>
    </div>
  </div>

  <button type="button" class="control primary" id="export" disabled></button>
  </div>

  <div id="paneImport" class="hidden">
    <div class="card">
      <h1 id="importTitle"></h1>
      <div class="sub" id="importHint"></div>
    </div>
    <div class="field">
      <span class="field-label" id="rangeLabel"></span>
      <input type="text" class="control secondary field-input" id="range" inputmode="numeric" />
    </div>
    <input type="file" id="file" accept=".pptx" hidden />
    <button type="button" class="control primary" id="pick"></button>
  </div>

  <div class="card hidden" id="warnings"></div>

  <script>__SCRIPT__</script>
</body>
</html>
