<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    font: 11px/1.5 Inter, "Pretendard", "Malgun Gothic", -apple-system, sans-serif;
    background: var(--figma-color-bg, #fff);
    color: var(--figma-color-text, #000);
  }
  h1 { font-size: 11px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
  .card {
    border: 1px solid var(--figma-color-border, #e5e5e5);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .size {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .size small { font-size: 11px; font-weight: 400; opacity: .7; }
  .sub { color: var(--figma-color-text-secondary, #666); margin-top: 2px; }
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--figma-color-bg-brand-tertiary, #e5f0ff);
    color: var(--figma-color-text-brand, #0d63f3);
    font-size: 11px;
    font-weight: 600;
    vertical-align: 3px;
    margin-left: 6px;
  }
  .blocked {
    background: var(--figma-color-bg-danger-tertiary, #ffe8e5);
    color: var(--figma-color-text-danger, #b3261e);
    border-radius: 6px;
    padding: 10px;
    white-space: pre-wrap;
    margin-bottom: 8px;
  }

  /* 드롭다운과 버튼을 같은 규격으로 맞춘다 — 나란히 놓이는 컨트롤이라 형태가 어긋나면 눈에 띈다. */
  .control {
    display: block;
    width: 100%;
    height: 32px;
    padding: 0 10px;
    border-radius: 6px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  select.control {
    appearance: none;
    -webkit-appearance: none;
    border: 1px solid var(--figma-color-border, #e5e5e5);
    background-color: transparent;
    color: var(--figma-color-text, #000);
    /* 네이티브 화살표를 끄고 테마를 따라가는 커스텀 화살표를 넣는다 */
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'%3E%3Cpath d='M0 0l4 5 4-5z' fill='%23888'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 26px;
    margin-bottom: 6px;
  }
  select.control:hover { border-color: var(--figma-color-border-selected, #0d99ff); }
  button.control {
    border: 1px solid transparent;
    background: var(--figma-color-bg-brand, #0d99ff);
    color: #fff;
  }
  button.control:disabled {
    background: var(--figma-color-bg-disabled, #e5e5e5);
    color: var(--figma-color-text-disabled, #b3b3b3);
    cursor: not-allowed;
  }

  #warnings { max-height: 200px; overflow-y: auto; margin: 8px 0 0; }
  #warnings ul { margin: 6px 0 0; padding-left: 16px; }
  #warnings li { margin-bottom: 4px; color: var(--figma-color-text-secondary, #666); }
  #warnings li:last-child { margin-bottom: 0; }
  #warnings b { color: var(--figma-color-text, #000); font-weight: 600; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>슬라이드 크기</h1>
    <div class="size" id="size">—</div>
    <div class="sub" id="detail">프레임을 선택하세요</div>
  </div>

  <div class="blocked hidden" id="blocked"></div>

  <select class="control" id="dpi">
    <option value="96">이미지 해상도 96 DPI</option>
    <option value="150">이미지 해상도 150 DPI</option>
    <option value="220" selected>이미지 해상도 220 DPI</option>
    <option value="300">이미지 해상도 300 DPI</option>
  </select>

  <button class="control" id="export" disabled>PPTX 내보내기</button>

  <div class="card hidden" id="warnings"></div>

  <script>__SCRIPT__</script>
</body>
</html>
