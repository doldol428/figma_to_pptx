<!--
  플러그인 아이콘 — 벡터 원본.
  PNG 는 tools/make-icon.mjs 가 같은 좌표로 렌더한다 (`npm run icon`).
  좌표를 고치면 양쪽 다 고칠 것.

  세로 용지(42/59 = 0.71, A4)와 가로 슬라이드(40/22.5 = 1.78, 16:9)를 대각선으로 둔다.
  둘 다 원래 비율 그대로라는 게 이 플러그인의 전부라, 마크도 그것만 말한다.
  겹치면 한 덩어리로 읽혀서 가로·세로 모두 간격을 띄웠다.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#0D99FF"/>
  <rect x="20" y="21" width="42" height="59" rx="5" fill="#FFFFFF"/>
  <rect x="68" y="85" width="40" height="22.5" rx="4" fill="#FFFFFF"/>
</svg>
