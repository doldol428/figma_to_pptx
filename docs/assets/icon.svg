<!--
  플러그인 아이콘 초안 — 128×128 PNG 로 내보내서 게시 모달에 업로드한다.

  세로 용지(A4 비율 0.707)와 가로 슬라이드(16:9)를 나란히 둔다.
  둘 다 원래 비율 그대로라는 게 이 플러그인의 전부라, 마크도 그것만 말한다.
  32px 까지 줄여도 읽히도록 도형은 두 개로 제한했다.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#0D99FF"/>
  <!-- 세로 용지 — 48/68 = 0.706 (A4) -->
  <rect x="24" y="23" width="48" height="68" rx="5" fill="#FFFFFF"/>
  <!-- 가로 슬라이드 — 48/27 = 1.778 (16:9). 겹치는 부분은 배경색 선으로 끊는다 -->
  <rect x="56" y="77" width="48" height="27" rx="5"
        fill="#FFFFFF" stroke="#0D99FF" stroke-width="6"/>
</svg>
